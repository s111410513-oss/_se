[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curl-lite"
version = "0.1.0"
description = "A curl-like HTTP client with zero runtime dependencies"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "s111410513-oss" }]
keywords = ["curl", "http", "cli", "http-client", "rest-client", "url"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
curl-lite = "curl_lite.cli:main"

[project.urls]
Homepage = "https://github.com/s111410513-oss/curl-lite-python"
Repository = "https://github.com/s111410513-oss/curl-lite-python"
Issues = "https://github.com/s111410513-oss/curl-lite-python/issues"

[tool.setuptools]
packages = ["curl_lite"]